<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Client Intake Questionnaire | Signal Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c1b2e;--gold:#c9a84c;--gold-soft:#d4b96e;--cream:#faf9f6;
  --ink:#0c1b2e;--ink-2:#3a3f4b;--ink-3:#5c6175;--sur-navy-2:#9fb0c6;--bord:#e4e3df;
  --bord-navy:rgba(201,168,76,.22);--or-encre:#7a5c0c;--erreur:#9b1c1c;
  --t-label:.72rem;--t-note:.9375rem;--t-body:1.0625rem;--pad:clamp(1rem,6vw,7rem)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink-2);
  font:400 var(--t-body)/1.68 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:"Playfair Display",Georgia,serif;color:var(--ink);font-weight:700;
  line-height:1.15;letter-spacing:-.01em;margin:0}
p{margin:0 0 1.15em}
.barre{background:var(--navy);border-bottom:1px solid var(--bord-navy);padding:1rem var(--pad)}
.barre__nom{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;text-decoration:none}
.barre__nom span{color:var(--gold)}
.bande{padding:clamp(2.25rem,6vw,4.5rem) var(--pad)}
.bande--navy{background:var(--navy);color:var(--sur-navy-2)}
.bande--navy h1{color:#fff;font-size:clamp(2rem,5vw,3.25rem)}
.dedans{max-width:46rem;margin:0 auto}
.etiq{display:block;font-size:var(--t-label);font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin:0 0 1.1rem}
.etiq::before{content:"";display:inline-block;width:1.75rem;height:1px;
  background:var(--gold);vertical-align:.28em;margin-right:.6rem}
.etiq:empty,h1:empty,.sous-titre:empty{display:none}
.sous-titre{margin:.85rem 0 0;font-size:var(--t-label);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--sur-navy-2)}
.intro{font-size:1.125rem;line-height:1.65;color:var(--ink);margin:0 0 1.1rem}
#intro{margin-bottom:2.5rem}
.partie{border-top:2px solid var(--gold);padding:2.25rem 0 .75rem;margin-top:1.75rem}
.partie h2{font-size:1.55rem;margin:0 0 1.5rem}
.partie h2 .num{color:var(--or-encre)}
.q{border:0;margin:0 0 2.25rem;padding:0;min-width:0}
.q > label,.q legend,.q .titre-q{display:block;font-weight:600;color:var(--ink);
  margin:0 0 .8rem;line-height:1.5;padding:0}
.q input[type=text],.q input[type=email],.q textarea{width:100%;font:inherit;color:var(--ink);
  background:#fff;border:2px solid var(--ink);border-radius:3px;padding:.85rem 1rem}
.q textarea{min-height:11rem;line-height:1.6;padding:1rem 1.1rem;resize:vertical;
  overflow-y:hidden}
.q input:focus,.q textarea:focus{outline:2px solid var(--gold);outline-offset:2px;
  border-color:var(--gold)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.25rem}
@media (max-width:640px){.duo{grid-template-columns:1fr}}
.choix{display:flex;flex-direction:column;gap:.7rem}
.choix label{display:flex;align-items:flex-start;gap:.75rem;cursor:pointer;color:var(--ink-2);
  line-height:1.5}
.choix input[type=checkbox]{margin-top:.3rem;accent-color:var(--gold);width:1.1rem;
  height:1.1rem;flex:none}
.choix label.inactif{opacity:.45;cursor:not-allowed}
.autre__texte{margin:.1rem 0 0 1.85rem;width:calc(100% - 1.85rem) !important}
.aide{font-size:var(--t-note);color:var(--ink-3);margin:.6rem 0 0;overflow-wrap:anywhere}
.aide:empty{display:none}
.aide--erreur{color:var(--erreur);font-weight:600}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.q > label.fichiers__bouton{display:inline-block;margin:.9rem 0 0;padding:.75rem 1.25rem;
  border:2px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);
  font-size:.9rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.q > label.fichiers__bouton:hover{border-color:var(--gold)}
input[type=file]:focus-visible + .fichiers__bouton{outline:2px solid var(--gold);
  outline-offset:2px}
.fichiers__liste{list-style:none;margin:.75rem 0 0;padding:0}
.fichiers__liste li{padding:.4rem 0;border-top:1px solid var(--bord);font-size:var(--t-note);
  color:var(--ink);overflow-wrap:anywhere}
.lien{background:none;border:0;padding:0;margin-top:.5rem;font:inherit;
  font-size:var(--t-note);color:var(--or-encre);text-decoration:underline;cursor:pointer}
.envoi{margin-top:2.5rem}
.cta{display:block;width:100%;border:0;cursor:pointer;font:inherit;font-size:.9375rem;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1.1rem 2rem;
  border-radius:3px;background:var(--gold);color:var(--navy)}
.cta:hover{background:var(--gold-soft)}
.cta:disabled{opacity:.6;cursor:wait}
.etat{margin:1.25rem 0 0;padding:1rem 1.15rem;border-left:2px solid var(--gold);
  background:#fff;font-size:var(--t-note);color:var(--ink-2);overflow-wrap:anywhere}
.etat[hidden]{display:none}
.etat--erreur{border-left-color:var(--erreur)}
.confirmation{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;
  line-height:1.5;color:var(--ink);padding:1.5rem 1.6rem;border-left:3px solid var(--gold);
  background:#fff}
.suite{margin-top:3rem;padding-top:2rem;border-top:2px solid var(--gold)}
.suite h2{font-size:1.55rem;margin:0 0 1rem}
.signature{margin-top:1.5rem;font-weight:700;color:var(--ink);letter-spacing:.02em}
[hidden]{display:none !important}
</style>
</head>
<body>
<nav class="barre"><a class="barre__nom" href="/">Tom Scally <span>Signal Shift</span></a></nav>
<header class="bande bande--navy">
  <div class="dedans">
    <span class="etiq" id="entete">Signal Shift | Outside Read</span>
    <h1 id="societe"></h1>
    <p class="sous-titre" id="sous-titre">Client Intake Questionnaire</p>
  </div>
</header>
<main class="bande">
  <div class="dedans">
    <div id="chargement"><p class="aide">Loading your questionnaire...</p>
      <noscript><p class="etat etat--erreur">This form needs JavaScript. Please enable it, or
      contact Tom at tom@tomscally.com.</p></noscript></div>
    <div id="invalide" hidden><p class="etat etat--erreur"></p></div>
    <div id="contenu" hidden>
      <div id="intro"></div>
      <div id="fini" hidden><p class="confirmation" id="message-fini" role="status"></p></div>
      <form id="questionnaire" method="post" novalidate>
        <div id="corps"></div>
        <div class="envoi"><button class="cta" type="submit" id="envoyer">Submit</button></div>
        <p class="etat" id="etat" role="status" aria-live="polite" hidden></p>
      </form>
      <section class="suite">
        <h2 id="suite-titre"></h2>
        <div id="suite-texte"></div>
        <p class="signature" id="signature"></p>
      </section>
    </div>
  </div>
</main>
<script>
(function () {
  var PORTE = "https://vps-39c10144.vps.ovh.net/formulaire/intake";
  var ADRESSE = "tom@tomscally.com";
  var CONFIRMATION = "Thank you. Your information has been received. Tom will review it and follow up personally.";
  var EXTENSIONS = ["pdf", "ppt", "pptx", "doc", "docx", "xls", "xlsx", "csv", "txt", "png", "jpg", "jpeg", "zip"];
  var MAX_FICHIERS = 5;
  var MAX_OCTETS = 52428800;

  var code = '';
  try { code = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim(); }
  catch (err) { code = ''; }

  var chargement = document.getElementById('chargement');
  var invalide = document.getElementById('invalide');
  var contenu = document.getElementById('contenu');
  var f = document.getElementById('questionnaire');
  var corps = document.getElementById('corps');
  var etat = document.getElementById('etat');
  var bouton = document.getElementById('envoyer');
  var fini = document.getElementById('fini');
  var cle = 'intake-brouillon:' + code;
  var choisis = [];

  function montrer(el) { el.hidden = false; }
  function cacher(el) { el.hidden = true; }
  function el(tag, attrs, texte) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (texte) { n.textContent = texte; }
    return n;
  }

  function dire(texte, erreur) {
    etat.textContent = texte;
    etat.classList.toggle('etat--erreur', !!erreur);
    montrer(etat);
  }

  function lienInvalide(message) {
    cacher(chargement);
    invalide.querySelector('p').textContent = message;
    montrer(invalide);
  }

  function poster(chemin, objet, delai, entetes) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var minuteur = ctrl ? setTimeout(function () { ctrl.abort(); }, delai) : null;
    var h = {'content-type': 'application/json'};
    Object.keys(entetes || {}).forEach(function (k) { h[k] = entetes[k]; });
    return fetch(PORTE + chemin, {
      method: 'POST', headers: h,
      body: JSON.stringify(objet), signal: ctrl ? ctrl.signal : undefined,
      credentials: 'omit', referrerPolicy: 'no-referrer'
    }).then(function (r) {
      if (minuteur) { clearTimeout(minuteur); }
      return r.json().catch(function () { return {}; }).then(function (x) {
        return {statut: r.status, x: x || {}};
      });
    }, function (err) {
      if (minuteur) { clearTimeout(minuteur); }
      throw err;
    });
  }

  function taille(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  }

  function agrandir(t) {
    var y = window.scrollY;
    var cs = window.getComputedStyle(t);
    var mini = parseFloat(cs.minHeight) || 0;
    var ligne = parseFloat(cs.lineHeight) || 27;
    t.style.minHeight = '0px';
    t.style.height = '0px';
    var contenu = t.scrollHeight + 4;
    t.style.minHeight = '';
    var cible = Math.max(mini, contenu + 2 * ligne);
    t.style.height = Math.min(cible, 900) + 'px';
    t.style.overflowY = cible > 900 ? 'auto' : 'hidden';
    window.scrollTo(window.scrollX, y);
  }
  var minuterieTaille = null;
  window.addEventListener('resize', function () {
    clearTimeout(minuterieTaille);
    minuterieTaille = setTimeout(function () {
      document.querySelectorAll('#questionnaire textarea').forEach(agrandir);
    }, 150);
  });

  function champ(c, parent) {
    if (c.type === 'ligne' || c.type === 'email') {
      var b = el('div', {'class': 'q q--court'});
      b.appendChild(el('label', {'for': c.id}, c.label));
      var i = el('input', {type: c.type === 'email' ? 'email' : 'text', id: c.id, name: c.id,
        maxlength: '200', autocomplete: c.type === 'email' ? 'email' : 'name'});
      if (c.requis) { i.setAttribute('required', ''); i.setAttribute('aria-required', 'true'); }
      b.appendChild(i);
      parent.appendChild(b);
    } else if (c.type === 'texte') {
      var t = el('div', {'class': 'q'});
      t.appendChild(el('label', {'for': c.id}, c.label));
      var z = el('textarea', {id: c.id, name: c.id, maxlength: '8000', rows: '7'});
      z.addEventListener('input', function () { agrandir(z); });
      t.appendChild(z);
      parent.appendChild(t);
    } else if (c.type === 'cases') {
      var fs = el('fieldset', {'class': 'q'});
      if (c.max) { fs.setAttribute('data-max', String(c.max)); }
      fs.appendChild(el('legend', {}, c.label));
      var choix = el('div', {'class': 'choix'});
      (c.options || []).forEach(function (o) {
        var l = el('label');
        l.appendChild(el('input', {type: 'checkbox', name: c.id, value: o}));
        l.appendChild(el('span', {}, o));
        choix.appendChild(l);
      });
      if (c.autre) {
        var la = el('label', {'class': 'autre'});
        la.appendChild(el('input', {type: 'checkbox', name: c.id, value: 'Other', 'data-autre': c.autre}));
        la.appendChild(el('span', {}, 'Other:'));
        choix.appendChild(la);
        choix.appendChild(el('input', {type: 'text', 'class': 'autre__texte', id: c.autre,
          name: c.autre, maxlength: '200', 'aria-label': 'Other, please specify'}));
      }
      fs.appendChild(choix);
      if (c.max) { fs.appendChild(el('p', {'class': 'aide', 'aria-live': 'polite'})); }
      parent.appendChild(fs);
    } else if (c.type === 'fichiers') {
      var d = el('div', {'class': 'q'});
      d.appendChild(el('span', {'class': 'titre-q'}, c.label));
      d.appendChild(el('p', {'class': 'aide'}, 'PDF, PowerPoint, Word, Excel, CSV, text, images or ZIP. Up to '
        + MAX_FICHIERS + ' files, ' + Math.round(MAX_OCTETS / 1048576) + ' MB in total. For larger files, please share a link above.'));
      d.appendChild(el('input', {type: 'file', id: 'fichiers', name: 'fichiers', multiple: '',
        accept: EXTENSIONS.map(function (x) { return '.' + x; }).join(',')}));
      d.appendChild(el('label', {'class': 'fichiers__bouton', 'for': 'fichiers'}, 'Choose files'));
      d.appendChild(el('ul', {'class': 'fichiers__liste', id: 'fichiers-liste'}));
      d.appendChild(el('p', {'class': 'aide aide--erreur', id: 'fichiers-erreur', 'aria-live': 'polite'}));
      var v = el('button', {type: 'button', 'class': 'lien', id: 'fichiers-vider'}, 'Remove files');
      v.hidden = true;
      d.appendChild(v);
      parent.appendChild(d);
    }
  }

  function construire(x) {
    var q = x.questionnaire || {};
    document.title = (q.sous_titre || 'Client Intake Questionnaire') + ' | Signal Shift';
    document.getElementById('entete').textContent = q.entete || 'Signal Shift | Outside Read';
    document.getElementById('societe').textContent = x.societe || '';
    document.getElementById('sous-titre').textContent = q.sous_titre || '';
    var intro = document.getElementById('intro');
    (q.introduction || []).forEach(function (t) { intro.appendChild(el('p', {'class': 'intro'}, t)); });
    (q.sections || []).forEach(function (s) {
      var sec = el('section', {'class': 'partie', id: 'partie-' + s.id});
      var h = el('h2');
      if (s.numero) { h.appendChild(el('span', {'class': 'num'}, s.numero + '. ')); }
      h.appendChild(document.createTextNode(s.titre));
      sec.appendChild(h);
      var cible = sec;
      if (s.id === 'personne') { cible = el('div', {'class': 'duo'}); sec.appendChild(cible); }
      (s.champs || []).forEach(function (c) { champ(c, cible); });
      corps.appendChild(sec);
    });
    document.getElementById('suite-titre').textContent = q.suite_titre || '';
    var suite = document.getElementById('suite-texte');
    (q.suite || []).forEach(function (t) { suite.appendChild(el('p', {}, t)); });
    if (x.offert_texte) {
      var dernier = suite.lastElementChild || suite.appendChild(el('p'));
      dernier.appendChild(document.createTextNode(' ' + x.offert_texte));
    }
    document.getElementById('signature').textContent = q.signature || '';
    document.getElementById('message-fini').textContent = q.confirmation || CONFIRMATION;
  }

  function lireBrouillon() {
    try {
      var b = JSON.parse(localStorage.getItem(cle) || 'null');
      if (!b || !b.t || Date.now() - b.t > 30 * 86400000) { effacerBrouillon(); return null; }
      return b.r;
    } catch (err) { return null; }
  }
  function ecrireBrouillon() {
    try { localStorage.setItem(cle, JSON.stringify({t: Date.now(), r: reponses()})); } catch (err) {}
  }
  function effacerBrouillon() {
    try { localStorage.removeItem(cle); } catch (err) {}
  }
  function poserBrouillon(b) {
    if (!b || typeof b !== 'object') { return; }
    Object.keys(b).forEach(function (k) {
      var v = b[k];
      if (Array.isArray(v)) {
        f.querySelectorAll('input[type=checkbox][name="' + k + '"]').forEach(function (n) {
          n.checked = v.indexOf(n.value) !== -1;
        });
      } else {
        var n = f.querySelector('[name="' + k + '"]');
        if (n && n.type !== 'file' && n.type !== 'checkbox') {
          n.value = v;
          if (n.tagName === 'TEXTAREA') { agrandir(n); }
        }
      }
    });
  }

  function reponses() {
    var champs = {};
    f.querySelectorAll('input[type=text],input[type=email],textarea').forEach(function (n) {
      if (n.classList.contains('autre__texte')) { return; }
      if (n.value.trim()) { champs[n.name] = n.value.trim(); }
    });
    f.querySelectorAll('fieldset.q').forEach(function (fs) {
      var cases = fs.querySelectorAll('input[type=checkbox]');
      if (!cases.length) { return; }
      var nom = cases[0].name;
      var liste = [];
      cases.forEach(function (n) {
        if (!n.checked) { return; }
        liste.push(n.value);
        if (n.dataset.autre) {
          var t = document.getElementById(n.dataset.autre);
          if (t && t.value.trim()) { champs[n.dataset.autre] = t.value.trim(); }
        }
      });
      if (liste.length) { champs[nom] = liste; }
    });
    return champs;
  }

  function borner(fs) {
    var max = parseInt(fs.dataset.max || '0', 10);
    if (!max) { return; }
    var cases = fs.querySelectorAll('input[type=checkbox]');
    var n = 0;
    cases.forEach(function (c) { if (c.checked) { n++; } });
    cases.forEach(function (c) {
      var plein = n >= max && !c.checked;
      c.disabled = plein;
      c.closest('label').classList.toggle('inactif', plein);
    });
    var mots = {2: 'two', 3: 'three'};
    var aide = fs.querySelector('.aide');
    if (aide) {
      aide.textContent = n >= max ? 'You can select up to ' + (mots[max] || max)
        + '. Untick one to change your choice.' : '';
    }
  }

  function montrerFichiers(erreur) {
    var liste = document.getElementById('fichiers-liste');
    if (!liste) { return; }
    liste.innerHTML = '';
    choisis.forEach(function (fi) { liste.appendChild(el('li', {}, fi.name + ' (' + taille(fi.size) + ')')); });
    document.getElementById('fichiers-erreur').textContent = erreur || '';
    document.getElementById('fichiers-vider').hidden = !choisis.length;
  }

  function controlerFichiers(liste) {
    if (liste.length > MAX_FICHIERS) { return 'Please choose up to ' + MAX_FICHIERS + ' files.'; }
    var total = 0;
    for (var i = 0; i < liste.length; i++) {
      var nom = liste[i].name || '';
      var ext = nom.indexOf('.') !== -1 ? nom.split('.').pop().toLowerCase() : '';
      if (EXTENSIONS.indexOf(ext) === -1) { return 'This file type is not accepted: ' + nom; }
      if (!liste[i].size) { return 'This file is empty: ' + nom; }
      total += liste[i].size;
    }
    if (total > MAX_OCTETS) { return 'These files are over ' + Math.round(MAX_OCTETS / 1048576) + ' MB in total. Please share a link instead.'; }
    return '';
  }

  function enBase64(fi) {
    return new Promise(function (ok, ko) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',').pop()); };
      r.onerror = function () { ko(new Error('lecture')); };
      r.readAsDataURL(fi);
    });
  }

  function brancher() {
    f.addEventListener('submit', envoyer);
    f.querySelectorAll('fieldset.q[data-max]').forEach(function (fs) {
      fs.addEventListener('change', function () { borner(fs); });
    });
    f.querySelectorAll('.autre__texte').forEach(function (t) {
      t.addEventListener('input', function () {
        var c = f.querySelector('input[data-autre="' + t.id + '"]');
        if (c && t.value.trim() && !c.checked && !c.disabled) {
          c.checked = true;
          var fs = c.closest('fieldset');
          if (fs) { borner(fs); }
        }
      });
    });
    var entree = document.getElementById('fichiers');
    if (entree) {
      entree.addEventListener('change', function () {
        var deja = choisis.map(function (fi) { return fi.name + '|' + fi.size + '|' + fi.lastModified; });
        var nouveaux = Array.prototype.slice.call(entree.files || []).filter(function (fi) {
          return deja.indexOf(fi.name + '|' + fi.size + '|' + fi.lastModified) === -1;
        });
        var liste = choisis.concat(nouveaux);
        var erreur = controlerFichiers(liste);
        if (!erreur) { choisis = liste; }
        entree.value = '';
        montrerFichiers(erreur);
      });
      document.getElementById('fichiers-vider').addEventListener('click', function () {
        choisis = []; entree.value = ''; montrerFichiers('');
      });
    }
    f.addEventListener('input', ecrireBrouillon);
    f.addEventListener('change', ecrireBrouillon);
  }

  function envoyer(ev) {
    ev.preventDefault();
    var champs = reponses();
    var nom = document.getElementById('nom');
    var mel = document.getElementById('email');
    if (nom && !champs.nom) { dire('Please add your name.', true); nom.focus(); return; }
    if (mel && (!champs.email || !mel.checkValidity() || !/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(champs.email))) {
      dire('Please enter a valid email address.', true); mel.focus(); return;
    }
    var oublie = null;
    f.querySelectorAll('.autre__texte').forEach(function (t) {
      var c = f.querySelector('input[data-autre="' + t.id + '"]');
      if (!oublie && t.value.trim() && c && !c.checked) { oublie = t; }
    });
    if (oublie) {
      var num = oublie.closest('section').querySelector('.num');
      var caseAutre = f.querySelector('input[data-autre="' + oublie.id + '"]');
      dire((num ? 'Question ' + num.textContent.replace('.', '').trim() + ': ' : '')
        + (caseAutre && caseAutre.disabled
          ? 'two answers are already selected. Untick one to keep what you typed in “Other”, or clear it.'
          : 'tick “Other” to include what you typed, or clear it.'), true);
      oublie.focus();
      return;
    }
    bouton.disabled = true;
    bouton.textContent = 'Sending...';
    dire(choisis.length ? 'Sending your answers and files. Large files can take a few minutes.' : 'Sending your answers...');
    Promise.all(choisis.map(function (fi) {
      return enBase64(fi).then(function (b) { return {nom: fi.name, contenu: b}; });
    })).then(function (fichiers) {
      return poster('/envoyer', {code: code, champs: champs, fichiers: fichiers}, 900000,
        {'x-intake-code': code});
    }).then(function (r) {
      if (r.statut === 200 && r.x.ok) {
        effacerBrouillon();
        choisis = [];
        cacher(f);
        cacher(document.getElementById('intro'));
        cacher(etat);
        montrer(fini);
        window.scrollTo(0, 0);
        return;
      }
      rendre();
      if (r.statut === 404) {
        dire('This link is no longer valid. Please contact Tom at ' + ADRESSE + '.', true);
      } else if (r.statut === 400 && r.x.erreur) {
        dire(r.x.erreur, true);
      } else if (r.statut === 429) {
        dire('Too many attempts. Please try again in an hour, or email Tom at ' + ADRESSE + '.', true);
      } else if (r.statut === 413) {
        dire('These files are too large. Please share a link instead.', true);
      } else if ((r.statut === 503 || r.statut === 507) && r.x.erreur) {
        dire(r.x.erreur, true);
      } else {
        echec();
      }
    }).catch(function () { rendre(); echec(); });
  }

  function rendre() { bouton.disabled = false; bouton.textContent = 'Submit'; }

  function echec() {
    dire('Your answers could not be sent just now. They are still on this page: please try '
      + 'again in a moment. If it keeps failing, email them to ' + ADRESSE + '.', true);
  }

  if (!code || code.length < 16) {
    lienInvalide('This link is not valid. Please use the exact link you received, or contact Tom at ' + ADRESSE + '.');
    return;
  }
  poster('/ouvrir', {code: code}, 15000).then(function (r) {
    if (r.statut === 200 && r.x.ok && r.x.questionnaire) {
      construire(r.x);
      cacher(chargement);
      montrer(contenu);
      brancher();
      try { poserBrouillon(lireBrouillon()); } catch (err) { effacerBrouillon(); }
      f.querySelectorAll('fieldset.q[data-max]').forEach(borner);
      return;
    }
    if (r.statut === 404) {
      lienInvalide('This link is not valid or is no longer active. Please contact Tom at ' + ADRESSE + '.');
    } else {
      lienInvalide('This page could not load just now. Please try again in a few minutes, or contact Tom at ' + ADRESSE + '.');
    }
  }).catch(function () {
    lienInvalide('This page could not load just now. Please try again in a few minutes, or contact Tom at ' + ADRESSE + '.');
  });
})();
</script>

</html>
